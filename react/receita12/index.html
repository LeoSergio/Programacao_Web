<!DOCTYPE html>

<html>

   <head>

      <title>ReceitaReact - 3</title>      

   </head>


   <body>

      <div id="app">

      </div>


      <!-- Bibliotecas locais na pasta react/libs -->
      <script src="../libs/react.js"></script>
      <script src="../libs/react-dom.js"></script>
      <script src="../libs/babel.js"></script>


      <script type="text/babel">

         const TabelaBebidas = (props) => {
            const cabecalhos = props.cabecalhos || [];
            const dados = props.dados || props.conteudo || [];

            return (
               <div>
                  <h1>{props.titulo || "Tabela de Bebidas"}</h1>

                  <table id="tabela" border="1">
                     <thead>
                        <tr>
                           {cabecalhos.map((cabecalho, index) => (
                              <th key={index}>{cabecalho}</th>
                           ))}
                        </tr>
                     </thead>

                     <tbody>
                        {dados.map((linha, indexLinha) => (
                           <tr key={indexLinha}>
                              {Array.isArray(linha)
                                 ? linha.map((coluna, indexColuna) => (
                                      <td key={indexColuna}>{coluna}</td>
                                   ))
                                 : Object.values(linha).map((coluna, indexColuna) => (
                                      <td key={indexColuna}>{coluna}</td>
                                   ))}
                           </tr>
                        ))}
                     </tbody>
                  </table>
               </div>
            );
         };

         const cabecalhos = ["Nome", "Marca", "Tipo", "Origem"];

         const bebidas = [
            ["Havana", "Engenho Anísio Santiago", "Cachaça Artesanal", "Salinas - MG"],
            ["Heineken", "Heineken N.V.", "Cerveja Lager", "Amsterdã - Holanda"],
            ["Johnnie Walker Black Label", "Diageo", "Whisky", "Kilmarnock - Escócia"],
            ["Tanqueray", "Diageo", "Gin", "Londres - Inglaterra"]
         ];

         ReactDOM.render(
            <TabelaBebidas 
               titulo="Tabela de Bebidas Diversas" 
               cabecalhos={cabecalhos} 
               dados={bebidas} 
            />,
            document.getElementById("app")
         );

      </script>


   </body>


</html>
